name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [amd64]
        include:
          - os: ubuntu-latest
            goarch: amd64
            goos: linux
            ext: ""
          - os: windows-latest
            goarch: amd64
            goos: windows
            ext: ".exe"
          - os: macos-latest
            goarch: amd64
            goos: darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go mod download
      - run: go build -v -o CipherGate${{ matrix.ext }} .
      - run: go vet ./...
      - uses: actions/upload-artifact@v4
        with:
          name: CipherGate-${{ matrix.goos }}-${{ matrix.goarch }}
          path: CipherGate${{ matrix.ext }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "CipherGate ${{ github.ref_name }}" \
            --generate-notes
          for dir in CipherGate-*/; do
            osarch="${dir%/}"
            gh release upload "${{ github.ref_name }}" "$dir"/* --clobber
          done
