      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#9d4efb"/>
    </linearGradient>
    <linearGradient id="gradH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#9d4efb"/>
    </linearGradient>
    <linearGradient id="panelSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9d4efb" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#9d4efb" stop-opacity="0"/>
    </radialGradient>
    
  </defs><rect x="1" y="1" width="1198" height="358" rx="22" fill="#0a0b10" stroke="#242838"/>
