"ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9aa2b8" text-anchor="middle" style="direction:ltr">Windows / macOS / Linux</text></g><g transform="translate(329.59999999999997,278)"><rect x="0" y="0" width="121" height="30" rx="15" fill="#12141d" stroke="#2c3247"/><text x="61" y="20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9aa2b8" text-anchor="middle" style="direction:ltr">desktop client</text></g></g><g><rect x="676" y="44" width="480" height="272" rx="18" fill="#12141d" stroke="#2c3247"/><rect x="676" y="44" width="480" height="272" rx="18" fill="url(#panelSheen)"/><text x="700" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#9aa2b8" style="direction:ltr">Your traffic</text><g><ellipse cx="1104" cy="84" rx="16" ry="10" fill="none" stroke="#646c85" stroke-width="1.6"/><circle cx="1104" cy="84" r="4.2" fill="#646c85"/><path d="M 1090 76 L 1100 82" stroke="#646c85" stroke-width="1.4" opacity="0"/></g><path d="M 1047.0 84 H 1084" stroke="#646c85" stroke-width="1.4" stroke-dasharray="3 4"/><g><rect x="791.0" y="66" width="250" height="36" rx="18" fill="#161925" stroke="url(#gradH)" stroke-width="1.6"/><path d="M 813.0 75 q0 -6 6 -6 h0 q6 0 6 6 v6 q0 6 -6 9 q-6 -3 -6 -9 z" fill="none" stroke="url(#grad)" stroke-width="1.6"/><text x="835.0" y="88.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#eef1f8" style="direction:ltr">SNI: www.google.com</text></g><text x="1132" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Vazirmatn','Noto Sans Arabic',sans-serif" font-size="11.5" fill="#646c85" text-anchor="end" style="direction:ltr">DPI sees normal Google traffic</text><path d="M 916.0 102 V 144" stroke="url(#gradH)" stroke-width="2"/><path d="M 916.0 202 V 212" stroke="#2c3247" stroke-width="1.4" stroke-dasharray="2 4"/><g><rect x="700" y="144" width="432" height="58" rx="12" fill="#12141d" stroke="#2c3247"/><rect x="700" y="144" width="432" height="58" rx="12" fill="url(#panelSheen)"/><rect x="700" y="144" width="5" height="58" rx="2.5" fill="#22d3ee"/><text x="720" y="169" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Vazirmatn','Noto Sans Arabic',sans-serif" font-size="21" font-weight="700" fill="#eef1f8" style="direction:ltr">MITM Engine</text><text x="720" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9aa2b8" style="direction:ltr">TLS termination, dynamic certs, SNI spoof</text></g><g><rect x="700" y="212" width="432" height="58" rx="12" fill="#12141d" stroke="#2c3247"/><rect x="700" y="212" width="432" height="58" rx="12" fill="url(#panelSheen)"/><rect x="700" y="212" width="5" height="58" rx="2.5" fill="#9d4efb"/><text x="720" y="237" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Vazirmatn','Noto Sans Arabic',sans-serif" font-size="21" font-weight="700" fill="#eef1f8" style="direction:ltr">GSA Relay Engine</text><text x="720" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9aa2b8" style="direction:ltr">Apps Script  →  Cloudflare Worker</text></g><path d="M 916.0 270 V 296" stroke="url(#gradH)" stroke-width="2"/><circle cx="707" cy="296" r="4" fill="url(#grad)"/><text x="720" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Vazirmatn','Noto Sans Arabic',sans-serif" font-size="12.5" fill="#9aa2b8" style="direction:ltr">Any target site</text></g></svg>