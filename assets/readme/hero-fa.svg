text><path d="M 284.0 102 V 144" stroke="url(#gradH)" stroke-width="2"/><path d="M 284.0 202 V 212" stroke="#2c3247" stroke-width="1.4" stroke-dasharray="2 4"/><g><rect x="68" y="144" width="432" height="58" rx="12" fill="#12141d" stroke="#2c3247"/><rect x="68" y="144" width="432" height="58" rx="12" fill="url(#panelSheen)"/><rect x="68" y="144" width="5" height="58" rx="2.5" fill="#22d3ee"/><text x="88" y="169" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Vazirmatn','Noto Sans Arabic',sans-serif" font-size="21" font-weight="700" fill="#eef1f8" style="direction:ltr">MITM Engine</text><text x="88" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9aa2b8" style="direction:ltr">TLS termination, dynamic certs, SNI spoof</text></g><g><rect x="68" y="212" width="432" height="58" rx="12" fill="#12141d" stroke="#2c3247"/><rect x="68" y="212" width="432" height="58" rx="12" fill="url(#panelSheen)"/><rect x="68" y="212" width="5" height="58" rx="2.5" fill="#9d4efb"/><text x="88" y="237" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Vazirmatn','Noto Sans Arabic',sans-serif" font-size="21" font-weight="700" fill="#eef1f8" style="direction:ltr">GSA Relay Engine</text><text x="88" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9aa2b8" style="direction:ltr">Apps Script  →  Cloudflare Worker</text></g><path d="M 284.0 270 V 296" stroke="url(#gradH)" stroke-width="2"/><circle cx="75" cy="296" r="4" fill="url(#grad)"/><text x="88" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Vazirmatn','Noto Sans Arabic',sans-serif" font-size="12.5" fill="#9aa2b8" style="direction:ltr">⁧هر سایت مقصد⁩</text></g></svg>