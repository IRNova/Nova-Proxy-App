<text x="1050" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="3" fill="#7fdcec" text-anchor="end" style="direction:ltr">CLOUDFLARE IP SHAPER</text><g><path d="M 1070 91.32 Q 1070 83.32 1078 79.32 L 1130 79.32 Q 1138 83.32 1138 91.32 L 1138 128.2 Q 1138 142.48 1104 156.08 Q 1070 142.48 1070 128.2 Z" fill="#161925" stroke="url(#grad)" stroke-width="2.6"/><path d="M 1070 91.32 Q 1070 83.32 1078 79.32 L 1130 79.32 Q 1138 83.32 1138 91.32 L 1138 128.2 Q 1138 142.48 1104 156.08 Q 1070 142.48 1070 128.2 Z" fill="url(#panelSheen)"/><g stroke="url(#grad)" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M 1086.32 139.07999999999998 L 1086.32 96.92 L 1121.68 139.07999999999998 L 1121.68 96.92"/></g></g><text x="1050" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Vazirmatn','Noto Sans Arabic',sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5" fill="url(#grad)" text-anchor="end" style="direction:ltr">NovaProxy</text><text x="1136" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Vazirmatn','Noto Sans Arabic',sans-serif" font-size="23" fill="#eef1f8" text-anchor="end" style="direction:ltr">⁧پروکسی دامنه‌فرانتینگ با دو موتور ⁦MITM⁩ و ⁦GSA Relay⁩⁩</text><text x="1136" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Vazirmatn','Noto Sans Arabic',sans-serif" font-size="17" fill="#9aa2b8" text-anchor="end" style="direction:ltr">⁧عبور از فیلترینگ هوشمند با فرانت‌کردن ترافیک به ⁦www.google.com⁩⁩</text><g transform="translate(1022,278)"><rect x="0" y="0" width="114" height="30" rx="15" fill="#12141d" stroke="#2c3247"/><text x="57" y="20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9aa2b8" text-anchor="middle" style="direction:ltr">Wails v3 / Go</text></