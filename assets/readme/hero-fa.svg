<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Vazirmatn','Noto Sans Arabic',sans-serif">
<title id="t">NovaProxy</title>
<desc id="d">نوا پروکسی، یک آی‌پی شیپر کلودفلر و پروکسی دامنه‌فرانتینگ با دو موتور MITM و GSA Relay. نمودار نشان می‌دهد ترافیک با نمای www.google.com فرانت شده و از طریق گوگل اپس اسکریپت به کلودفلر ورکر رله می‌شود و سپس به هر سایت مقصد می‌رسد.</desc>
